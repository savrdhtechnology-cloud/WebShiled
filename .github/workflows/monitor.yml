name: WebShield monitoring

# Vercel Hobby only allows a daily cron. This workflow calls the same
# monitoring endpoint every 15 minutes so uptime, SSL, Data Guard and
# database checks run continuously.
# Required repository secret: WEBSHIELD_CRON_SECRET (same value as the
# CRON_SECRET environment variable in Vercel).
# Optional repository variable: WEBSHIELD_MONITOR_URL.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: webshield-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run monitoring cycle
        env:
          CRON_SECRET: ${{ secrets.WEBSHIELD_CRON_SECRET }}
          MONITOR_URL: ${{ vars.WEBSHIELD_MONITOR_URL || 'https://savrdhtechnologies.com/webshield/api/cron/monitor' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::WEBSHIELD_CRON_SECRET is not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$MONITOR_URL")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Monitoring endpoint returned HTTP $status"
            exit 1
          fi
